<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="export.pageTitle">Export Markspot notes</title>
  <link rel="stylesheet" href="export.css">
</head>
<body>
  <main>
    <h1 data-i18n="export.heading">Export notes</h1>
    <p id="status" data-i18n="export.reading">Reading notes…</p>
    <p><a id="download" hidden data-i18n="export.downloadFile">Download the file</a></p>
    <p class="hint" data-i18n="export.hint">Save the file where Claude Code can read it, for example in the project folder. It holds the screenshots of your notes: do not share it without looking at them.</p>
  </main>
  <script type="module" src="export.js"></script>
</body>
</html>
