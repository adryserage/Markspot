<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Markspot video scenes</title>
<style>
  @font-face {
    font-family: "Atkinson";
    font-weight: 400;
    src: url("../../node_modules/@fontsource/atkinson-hyperlegible/files/atkinson-hyperlegible-latin-400-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Atkinson";
    font-weight: 700;
    src: url("../../node_modules/@fontsource/atkinson-hyperlegible/files/atkinson-hyperlegible-latin-700-normal.woff2") format("woff2");
  }
  :root {
    --ink: #151821;
    --paper: #ffffff;
    --marker: #f2ff3a;
    --muted: #4a5060;
    --line: #d9dce3;
    --mist: #f3f4f7;
    --term-text: #d9dce3;
    --term-dim: #9aa0ae;
    --font: "Atkinson", sans-serif;
    --mono: "Cascadia Mono", "Cascadia Code", Consolas, "DejaVu Sans Mono", monospace;
    /* L'écran : la même place pour les images filmées et les cartes, le texte dessous. */
    --screen-x: 240px;
    --screen-y: 40px;
    --screen-w: 1440px;
    --screen-h: 900px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font); }
  [hidden] { display: none !important; }

  .screen {
    position: absolute;
    left: var(--screen-x);
    top: var(--screen-y);
    width: var(--screen-w);
    height: var(--screen-h);
    border-radius: 14px;
    overflow: hidden;
  }
  .footage { border: 1px solid var(--line); background: var(--mist); }
  .footage img { display: block; width: 100%; height: 100%; }
  .caption {
    position: absolute;
    left: var(--screen-x);
    top: 970px;
    width: var(--screen-w);
    margin: 0;
    font-size: 46px;
    line-height: 60px;
    font-weight: 700;
    white-space: nowrap;
  }

  .cursor { position: absolute; width: 34px; height: 46px; pointer-events: none; }
  .ring {
    position: absolute;
    width: 0;
    height: 0;
    border: 3px solid var(--ink);
    border-radius: 50%;
    background: rgb(242 255 58 / 0.45);
  }

  /* Titre : le mot-symbole reçoit le surlignage de l'extension, puis sa pastille. */
  .title { position: absolute; left: var(--screen-x); top: 360px; }
  .title-row { display: flex; align-items: center; gap: 48px; }
  .title-row img { width: 168px; height: 168px; }
  .wordmark { position: relative; padding: 4px 30px 18px; }
  .wordmark h1 { margin: 0; font-size: 168px; line-height: 1; font-weight: 700; letter-spacing: -0.01em; }
  .mark {
    position: absolute;
    inset: 0;
    outline: 6px solid var(--marker);
    box-shadow: 0 0 0 9px var(--ink), inset 0 0 0 3px var(--ink);
    background: rgb(242 255 58 / 0.14);
    border-radius: 4px;
  }
  .pin {
    position: absolute;
    display: grid;
    place-items: center;
    width: 76px;
    height: 76px;
    border: 5px solid var(--ink);
    border-radius: 50%;
    background: var(--marker);
    font-size: 40px;
    font-weight: 700;
  }
  .title .pin { left: -38px; top: -38px; }
  .tagline { margin: 72px 0 0; font-size: 56px; line-height: 1.25; max-width: 1440px; text-wrap: balance; }

  /* Terminal : une session Claude Code, tapée puis répondue. */
  .terminal { background: var(--ink); color: var(--term-text); padding: 72px 88px; }
  .terminal .app { margin: 0 0 56px; font-size: 30px; color: var(--term-dim); }
  .terminal pre { margin: 0; font: 46px/1.4 var(--mono); white-space: pre; color: var(--paper); }
  .terminal .prompt { color: var(--marker); }
  .caret { display: inline-block; width: 0.6em; height: 1.1em; margin-left: 2px; vertical-align: -0.2em; background: var(--marker); }
  .steps { margin: 64px 0 0; padding: 0; list-style: none; }
  .steps li { display: flex; align-items: baseline; gap: 28px; margin: 0 0 30px; font: 38px/1.4 var(--mono); }
  .steps li::before {
    content: "";
    flex: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--marker);
    transform: translateY(-4px);
  }

  .pending { display: grid; place-items: center; border: 3px dashed var(--line); background: var(--mist); }
  .pending p { margin: 0; font-size: 40px; color: var(--muted); }

  .statement { position: absolute; left: var(--screen-x); top: 300px; width: var(--screen-w); margin: 0; font-size: 104px; line-height: 1.2; font-weight: 700; }
  .statement span { display: block; text-wrap: balance; }
  .statement span + span { color: var(--muted); }

  .end { position: absolute; left: var(--screen-x); top: 190px; }
  .end-brand { display: flex; align-items: center; gap: 28px; margin: 0 0 64px; font-size: 80px; font-weight: 700; }
  .end-brand img { width: 96px; height: 96px; }
  .end pre {
    display: inline-block;
    margin: 0;
    padding: 40px 56px;
    border-radius: 14px;
    background: var(--ink);
    color: var(--paper);
    font: 52px/1.5 var(--mono);
  }
  .end pre .prompt { color: var(--marker); }
  .end .free { margin: 64px 0 12px; font-size: 56px; font-weight: 700; }
  .end .repo { margin: 0; font-size: 44px; color: var(--muted); }
</style>
</head>
<body>
<main id="stage"></main>
<script>
  const ICON = "../../extension/icons/src/icon.svg";
  const CURSOR_SVG = `<svg viewBox="0 0 34 46" xmlns="http://www.w3.org/2000/svg"><path d="M3 3 L3 37 L12 29 L18 43 L24 40 L18 27 L30 27 Z" fill="#151821" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
  const ease = (t) => 1 - (1 - t) ** 3;
  const clamp01 = (t) => Math.min(1, Math.max(0, t));
  const h = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };
  /** Une entrée : fondu et petite montée, de start à start + dur (secondes). */
  const enter = (node, t, start, dur = 0.45, rise = 14) => {
    const k = ease(clamp01((t - start) / dur));
    node.style.opacity = String(k);
    node.style.transform = `translateY(${(1 - k) * rise}px)`;
  };

  let scene = null;

  const CARDS = {
    title(stage, s) {
      const root = h("div", "title");
      const row = h("div", "title-row");
      const icon = h("img");
      icon.src = ICON;
      const word = h("div", "wordmark");
      const mark = h("div", "mark");
      const pin = h("div", "pin", "1");
      word.append(mark, h("h1", "", "Markspot"), pin);
      row.append(icon, word);
      const tagline = h("p", "tagline", s.text.tagline);
      root.append(row, tagline);
      stage.append(root);
      return {
        settle: 1.3,
        frame(t) {
          enter(row, t, 0, 0.4, 10);
          // Le surlignage se trace de gauche à droite, comme quand le pointeur arrive sur un élément.
          const k = ease(clamp01((t - 0.3) / 0.4));
          mark.style.clipPath = `inset(-20px ${(1 - k) * 100}% -20px -20px)`;
          const p = ease(clamp01((t - 0.65) / 0.25));
          pin.style.opacity = String(p);
          pin.style.transform = `scale(${0.6 + 0.4 * p})`;
          enter(tagline, t, 0.75, 0.45);
        },
      };
    },
    terminal(stage, s) {
      const screen = h("section", "screen terminal");
      const pre = h("pre");
      const prompt = h("span", "prompt", "> ");
      const typed = h("span");
      const caret = h("span", "caret");
      pre.append(prompt, typed, caret);
      const steps = h("ul", "steps");
      const items = s.text.claudeSteps.map((line) => h("li", "", line));
      steps.append(...items);
      screen.append(h("p", "app", "Claude Code"), pre, steps);
      stage.append(screen);
      const typeStart = 0.5;
      const perChar = 0.06;
      const typeEnd = typeStart + s.text.prompt.length * perChar;
      const stepAt = (i) => typeEnd + 0.6 + i * 0.7;
      return {
        settle: stepAt(items.length - 1) + 0.45,
        frame(t) {
          const chars = Math.max(0, Math.min(s.text.prompt.length, Math.floor((t - typeStart) / perChar)));
          typed.textContent = s.text.prompt.slice(0, chars);
          caret.hidden = t > typeEnd + 0.35;
          items.forEach((li, i) => enter(li, t, stepAt(i), 0.4, 10));
        },
      };
    },
    local(stage, s) {
      const p = h("p", "statement");
      const lines = s.text.local.map((line) => h("span", "", line));
      p.append(...lines);
      stage.append(p);
      return {
        settle: 0.8,
        frame(t) {
          lines.forEach((line, i) => enter(line, t, 0.1 + i * 0.3, 0.45));
        },
      };
    },
    end(stage, s) {
      const root = h("div", "end");
      const brand = h("p", "end-brand");
      const icon = h("img");
      icon.src = ICON;
      brand.append(icon, "Markspot");
      const pre = h("pre");
      for (const [i, command] of ["npm install -g markspot", "markspot install"].entries()) {
        if (i) pre.append("\n");
        pre.append(h("span", "prompt", "$ "), command);
      }
      const free = h("p", "free", s.text.openSource);
      const repo = h("p", "repo", "github.com/adryserage/Markspot");
      const block = h("div");
      block.append(pre);
      root.append(brand, block, free, repo);
      stage.append(root);
      return {
        settle: 0.9,
        frame(t) {
          enter(brand, t, 0.05);
          enter(block, t, 0.2);
          enter(free, t, 0.4);
          enter(repo, t, 0.45);
        },
      };
    },
  };

  /** Prépare une scène. spec : { kind, card?, caption?, captionIn, captionOut, text, pending? }. */
  window.setup = async (spec) => {
    const stage = document.getElementById("stage");
    stage.replaceChildren();
    document.documentElement.lang = spec.lang;
    let card = null;
    let img = null;
    let cursor = null;
    let ring = null;
    if (spec.kind === "card") {
      card = CARDS[spec.card](stage, spec);
    } else if (spec.pending) {
      const screen = h("section", "screen pending");
      screen.append(h("p", "", spec.text.pending));
      stage.append(screen);
    } else {
      const screen = h("section", "screen footage");
      img = h("img");
      img.alt = "";
      screen.append(img);
      ring = h("div", "ring");
      cursor = h("div", "cursor");
      cursor.innerHTML = CURSOR_SVG;
      stage.append(screen, ring, cursor);
    }
    const caption = spec.caption ? h("p", "caption", spec.caption) : null;
    if (caption) stage.append(caption);
    await document.fonts.ready;
    await Promise.all([...stage.querySelectorAll("img")].map((i) => (i.src ? i.decode() : null)));
    if (caption && caption.scrollWidth > caption.clientWidth) {
      throw new Error(`caption wider than the screen: ${spec.caption}`);
    }
    scene = { card, img, cursor, ring, caption, scale: spec.scale ?? 1, captionIn: spec.captionIn, captionOut: spec.captionOut };
  };

  /**
   * Dessine l'instant t (secondes). Pour une prise filmée, shot = { src, x, y, sinceClick } en
   * px CSS de la prise. Rend une signature : deux images de même signature sont identiques.
   */
  window.frame = async (t, shot) => {
    const { card, img, cursor, ring, caption, scale, captionIn, captionOut } = scene;
    const tt = Math.min(t, card ? card.settle : 0);
    if (card) card.frame(tt);
    let signature = `${tt.toFixed(4)}`;
    if (caption) {
      // Le texte sortant a disparu avant le fondu entre deux scènes ; l'entrant vient après.
      enter(caption, Math.min(t, captionIn + 0.45), captionIn, 0.45, 10);
      const out = 1 - ease(clamp01((t - captionOut) / 0.3));
      caption.style.opacity = String(Number(caption.style.opacity) * out);
      signature += `|${caption.style.opacity}|${caption.style.transform}`;
    }
    if (img && shot) {
      if (!img.src.endsWith(shot.src)) {
        img.src = shot.src;
        await img.decode();
      }
      const x = 240 + shot.x * scale;
      const y = 40 + shot.y * scale;
      // Pointe de la flèche sur le point visé.
      cursor.style.left = `${x - 3}px`;
      cursor.style.top = `${y - 3}px`;
      const k = shot.sinceClick === null ? 1 : clamp01(shot.sinceClick / 10);
      ring.hidden = k >= 1;
      const r = 10 + 26 * ease(k);
      ring.style.left = `${x - r}px`;
      ring.style.top = `${y - r}px`;
      ring.style.width = ring.style.height = `${2 * r}px`;
      ring.style.opacity = String(1 - k);
      signature += `|${shot.src}|${x.toFixed(1)}|${y.toFixed(1)}|${k.toFixed(3)}`;
    }
    return signature;
  };
</script>
</body>
</html>
