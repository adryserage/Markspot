<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plans · Fieldnote</title>
<style>
  body { margin: 0; font: 16px/1.5 Georgia, "Times New Roman", serif; background: #f6f4ef; color: #1d2530; }
  header { background: #1f3a2e; color: #f6f4ef; padding: 28px 48px; }
  header h1 { margin: 0; font-size: 30px; }
  main { padding: 40px 48px; }
  .plans { display: flex; gap: 20px; margin-top: 20px; }
  .plan { width: 300px; background: #fff; border: 1px solid #d8d3c8; border-radius: 6px; padding: 24px; }
  .plan h2 { margin: 0 0 8px; font-size: 24px; }
  .price { margin: 0 0 20px; }
  .buy { display: block; width: 340px; padding: 10px; border: 0; border-radius: 4px; background: #c2410c; color: #fff; font: 16px sans-serif; }
</style>
</head>
<body>
<header><h1>Choose your plan</h1></header>
<main>
  <p>Every plan includes unlimited field notes and offline sync.</p>
  <div class="plans">
    <section class="plan"><h2>Starter</h2><p class="price">$9 per month</p><button class="buy" id="buy-starter">Start Starter</button></section>
    <section class="plan"><h2>Team</h2><p class="price">$29 per month</p><button class="buy" id="buy-team" style="width:100%">Start Team</button></section>
  </div>
</main>
</body>
</html>
